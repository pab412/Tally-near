[package]
name = "tally-card"
description = "Tally's verified card on NEAR: a non-transferable NFT that exists only while the proof registry says the card is real."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pab412/tally-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
near-contract-standards = "5.30"
tally-types = { path = "../types" }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
