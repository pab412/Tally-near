[package]
name = "tally-guard"
description = "An example agent wallet on NEAR that asks Tally's proof registry who it is safe to pay: it pays the holder of a card the registry says is Real, up to a limit its owner set, and refuses everything else."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/pab412/tally-near"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
tally-types = { path = "../types" }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
